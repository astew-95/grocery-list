<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Shopping List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .version-selector {
            margin-bottom: 1.5rem;
        }

        select {
            font-size: 1rem;
            padding: 0.4rem;
        }

        input[type="text"] {
            line-height: 2;
            padding-left: 1rem;
        }

        .table-container {
            display: grid;
            grid-template-columns: 1fr;
            width: fit-content;
            min-width: 50%;
            /* max-width: 50%; */
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 0.75rem;
            /* border: 1px solid #888; */
            border-bottom: 1px solid #ddd;
        }

        td.store {
            width: 1%;
            white-space: nowrap;
            color: #ccc;
            text-align: right;
        }

        td.actions {
            width: 1%;
            white-space: nowrap;
        }

        a.button,
        button {
            background-color: #fff;
            border: 0.1rem solid;
            border-radius: 0.4rem;
            padding: 0.5rem 1rem;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn {
            color: #90b090;
            border-color: #90b090;
        }

        .add-btn:hover {
            background-color: #90b090;
            color: #fff;
        }

        .delete-btn {
            color: #dc3545;           /* Red text and icon color */
            border-color: #dc3545;
            font-weight: 600;
            cursor: pointer;
        }

        /* Filled background on hover */
        .delete-btn:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .grocery-list-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

    </style>
</head>

<body>

<div class="table-container">
    <div class="grocery-list-heading">
        <select
            id="store"
            onchange="window.location.href = '/' + encodeURIComponent(this.value)"
        >   
            {% if selected_store is none %}
            <option value="" selected disabled hidden>Please choose a grocery list</option>
            {% endif %}
            {% for store in stores %}
            <option
                value="{{ store }}"
                {% if store == selected_store %}selected{% endif %}
            >
                {{ store }}
            </option>
            {% endfor %}
        </select>
        
        {% if selected_store is not none %}
        <form action="/{{ selected_store }}/additem" method="post">
            <input
                id="item"
                name="item"
                type="text"
                placeholder="New item"
                required>
            
            <button class="add-btn" type="submit">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <line x1="12" y1="0" x2="12" y2="24"/>
                    <line x1="0" y1="12" x2="24" y2="12"/>
                </svg>
            </button>
        </form>
        {% endif %}
    </div>

    {% if items %}

    <table class="shopping-list-items">
        <tbody>
            {% for item, store in items %}
            <tr>
                <td>{{ item }}</td>
                <td class="store"><p>({{ store }})</p></td>
                <td class="actions">
                    <form action="/{{ store }}/delitem" method="post">
                        <button class="delete-btn" type="submit">
                            <input
                                id="item"
                                name="item"
                                type="hidden"
                                value="{{ item }}"
                            >
                            <input
                                id="current_store"
                                name="current_store"
                                type="hidden"
                                value="{{ selected_store }}"
                            >
                            <!-- Inline SVG Trashcan -->
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M3 6h18"/>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                <line x1="10" y1="11" x2="10" y2="17"/>
                                <line x1="14" y1="11" x2="14" y2="17"/>
                            </svg>
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% elif selected_store is not none %}

<p>No items to buy from: {{ selected_store }}.</p>

{% endif %}

</body>
</html>
